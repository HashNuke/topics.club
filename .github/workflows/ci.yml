name: CI

on:
  pull_request:
  push:
    branches: [main, app-split]

jobs:
  precommit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ircpipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ircpipe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci --prefix assets

      - name: Prevent boundary baseline expansion
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:config/boundaries.exs" 2>/dev/null; then
            mix ircpipe.check_boundaries --baseline-ref "$BASE_SHA"
          else
            echo "Base commit predates the boundary manifest; running the head policy only."
            mix ircpipe.check_boundaries
          fi

      - name: Run precommit suite
        run: mix precommit
