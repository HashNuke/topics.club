name: CI

on:
  pull_request:
  push:
    branches: [main, app-split]

jobs:
  precommit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topics_club_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d topics_club_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/topics_club_gateway/assets/package-lock.json

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci --prefix apps/topics_club_gateway/assets

      - name: Prevent boundary baseline expansion
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:config/boundaries.exs" 2>/dev/null; then
            mix topics_club.check_boundaries --baseline-ref "$BASE_SHA"
          else
            echo "Base commit predates the boundary manifest; running the head policy only."
            mix topics_club.check_boundaries
          fi

      - name: Run precommit suite
        run: mix precommit

      - name: Build and inspect release artifacts
        env:
          TOPICS_CLUB_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          MIX_ENV=prod mix assets.deploy
          MIX_ENV=prod mix release topics_club
          MIX_ENV=prod mix release topics_club_gateway
          MIX_ENV=prod mix release topics_club_engine

          has_path() {
            compgen -G "$1" >/dev/null
          }

          combined=_build/prod/rel/topics_club
          web=_build/prod/rel/topics_club_gateway
          engine=_build/prod/rel/topics_club_engine

          has_path "$combined/lib/topics_club_core-*"
          has_path "$combined/lib/topics_club_engine-*"
          has_path "$combined/lib/topics_club_gateway-*"
          test -x "$combined/bin/server"
          test -x "$combined/bin/migrate"
          has_path "$combined/lib/topics_club_gateway-*/priv/static/cache_manifest.json"

          has_path "$web/lib/topics_club_core-*"
          has_path "$web/lib/topics_club_gateway-*"
          ! has_path "$web/lib/topics_club_engine-*"
          test -x "$web/bin/server"
          test -x "$web/bin/migrate"
          has_path "$web/lib/topics_club_gateway-*/priv/static/cache_manifest.json"

          has_path "$engine/lib/topics_club_core-*"
          has_path "$engine/lib/topics_club_engine-*"
          ! has_path "$engine/lib/topics_club_gateway-*"
          ! has_path "$engine/lib/*/ebin/Elixir.TopicsClub.Release.beam"
          test ! -e "$engine/bin/server"
          test ! -e "$engine/bin/migrate"
