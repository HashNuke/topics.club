services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_NAME: topics_club_prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
      IRC_CREDENTIALS_KEY: ${IRC_CREDENTIALS_KEY:?Set IRC_CREDENTIALS_KEY in .env}
      GATEWAY_HOST: ${GATEWAY_HOST:?Set GATEWAY_HOST in .env}
      PORT: 4000
      ENABLE_DISCOVERY: ${ENABLE_DISCOVERY:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${TOPICS_CLUB_BIND_IP:-127.0.0.1}:${TOPICS_CLUB_PORT:-4000}:4000"
    command: sh -c "/app/bin/migrate && /app/bin/server"
    init: true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: topics_club_prod
    volumes:
      - ${TOPICS_CLUB_POSTGRES_DATA:?Set TOPICS_CLUB_POSTGRES_DATA to a host directory for database data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d topics_club_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
